<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wallpaper Order Line</title>
<style>
:root{--ink:#1d1d1b;--muted:#777;--ground:#f6f4ef;--panel:#fff;--line:#dedbd3;--accent:#176b5b;--warn:#b47722;--danger:#a33a32}
*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.45 Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{font-size:20px;font-weight:700}.nav{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:9px 13px}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btn:disabled{opacity:.45;cursor:not-allowed}
main{max-width:1250px;margin:0 auto;padding:30px 22px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.top h1{font-size:30px;margin:0 0 5px}.muted{color:var(--muted)}
.rail{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:18px}.stage{background:#fff;border:1px solid var(--line);padding:14px;text-align:left;border-radius:8px}.stage.active{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}.stage b{display:block;font-size:22px}.stage span{display:block;color:var(--muted);margin-top:3px}
.toolbar{display:flex;gap:8px;margin:15px 0}.search{flex:1}.search input,.track input,.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:7px;background:#fff;padding:10px}.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 13px}.chip.active{background:var(--ink);color:#fff}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px}th,td{text-align:left;padding:14px 15px;border-bottom:1px solid #eee;vertical-align:top}th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}tbody tr{cursor:pointer}tbody tr:hover{background:#faf9f6}.code{font-weight:700}.sub{display:block;color:var(--muted);font-size:12px;margin-top:3px}.tag{display:inline-block;padding:4px 8px;border-radius:5px;background:#eee}.tag.warn{background:#f4e7ce}.tag.good{background:#dceee8}.tag.blue{background:#dce9ef}.empty{padding:40px;text-align:center}.hide{display:none!important}
.mb{margin:18px 0;background:#fff;border:1px solid var(--line);border-radius:10px}.mbhead{padding:14px 16px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.mbhead h3{margin:0;margin-right:auto}.mbrow{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #eee;gap:15px}.count{border-radius:20px;background:var(--ink);color:#fff;padding:2px 8px}
.detail{max-width:1000px;margin:auto}.crumb{margin-bottom:15px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:15px}.card h2,.card h3{margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.timeline{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.step{padding:12px;border-top:4px solid #ddd;background:#faf9f6}.step.done{border-color:var(--accent)}.step.now{border-color:var(--warn)}.step b{display:block}.track{max-width:750px;margin:50px auto}.track h1{font-size:34px}.trackform{display:flex;gap:8px;margin:20px 0}.statuslog{border-left:2px solid var(--line);padding-left:18px}.log{margin:0 0 15px}.notice{padding:10px 12px;background:#f4e7ce;border-radius:7px;margin-bottom:12px}
@media(max-width:800px){.rail{grid-template-columns:repeat(2,1fr)}.timeline{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}header{padding:14px 16px}main{padding:22px 14px}}
</style>
</head>
<body>
<header><div class="brand">Wallpaper Order Line</div><div class="nav"><button class="btn" id="boardBtn">Board</button><button class="btn" id="trackBtn">Track order</button><button class="btn" id="authBtn">Sign in</button></div></header>
<main>
<section id="board">
<div class="top"><div><h1>Six checkpoints, every order</h1><div class="muted">Procurement board for custom wallpaper orders.</div></div><button class="btn primary" id="newBtn">Add an order</button></div>
<div class="rail" id="rail"></div>
<section class="mb hide" id="mb"></section>
<div class="toolbar"><div class="search"><input id="q" placeholder="Search PO, ENQ, customer, design or BM"></div><button class="chip active" data-scope="open">Open orders</button><button class="chip" data-scope="all">Everything</button><button class="chip" data-scope="attn">Needs attention</button></div>
<div class="panel"><div class="tablewrap"><table><thead><tr><th>PO / ENQ</th><th>Customer</th><th>Design & vendor</th><th>Status</th><th>Age</th><th>Delivery</th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" class="empty hide"></div></div>
</section>
<section id="detail" class="detail hide"></section>
<section id="tracking" class="track hide"><h1>Where is my wallpaper?</h1><p class="muted">Enter the PO number or enquiry ID from your order confirmation.</p><div class="trackform"><input id="trackQ" placeholder="PO or ENQ ID"><button class="btn primary" id="trackGo">Track</button></div><div id="trackResult"></div></section>
</main>
<script>
const STAGES=[
{key:"placed",label:"Order placed",statuses:["Customer Visited","Design Selected","Order Confirmed","PO Raised"]},
{key:"dimensions",label:"Dimensions in",statuses:["Measurements Pending","Site Audit Scheduled","Measurements Received","Sent to Procurement","Sent to Vendor"]},
{key:"render",label:"Render shared",statuses:["Render In Progress","Render Ready","Awaiting Customer Approval","Revision Requested"]},
{key:"approved",label:"Render approved",statuses:["Approved for Printing","Printing","Printed"]},
{key:"warehouse",label:"In warehouse",statuses:["Dispatched by Vendor","Received at Warehouse","Ready for Delivery"]},
{key:"delivery",label:"Delivery",statuses:["Out for Delivery","Delivered"]}];
const ALL=STAGES.flatMap(x=>x.statuses), SKIP=new Set(["Render In Progress","Render Ready","Awaiting Customer Approval","Revision Requested","Approved for Printing","Printing","Printed"]);
const patience={"Measurements Pending":3,"Site Audit Scheduled":3,"Sent to Vendor":2,"Render In Progress":2,"Awaiting Customer Approval":3,"Revision Requested":2,"Approved for Printing":1,"Printing":3,"Printed":2,"Dispatched by Vendor":4,"Received at Warehouse":3,"Ready for Delivery":3,"Out for Delivery":1};
let orders=[],scope="open",stage=null,active=null;
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])), key=()=>localStorage.getItem("mdwp:key")||"";
const now=()=>new Date().toISOString(), date=s=>s?new Date(s).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"2-digit"}):"—";
async function api(path,opt={}){opt.headers=Object.assign({"Content-Type":"application/json","x-team-key":key()},opt.headers||{});const r=await fetch(path,opt);if(!r.ok){let j={};try{j=await r.json()}catch{};let e=new Error(j.error||"Request failed");e.code=r.status;throw e}return r.json()}
async function load(){try{const j=await api("/api/orders");orders=(j.orders||[]).map(x=>Object.assign({id:x.id},x.doc));render()}catch(e){if(e.code===401) orders=[];render()}}
function stageOf(s){return STAGES.find(x=>x.statuses.includes(s))||STAGES[0]}
function age(o){return Math.max(0,Math.floor((Date.now()-new Date(o.statusAt||o.createdAt||now()))/86400000))}
function attention(o){let a=[];if(o.onHold)a.push("On hold");if(o.exception)a.push(o.exception);if(!["Delivered"].includes(o.status)&&age(o)>(patience[o.status]??5))a.push("Overdue stage");if(o.deliveryDate&&!["Delivered"].includes(o.status)&&o.deliveryDate<new Date().toISOString().slice(0,10))a.push("Late delivery");return a}
function renderRail(){$("#rail").innerHTML=STAGES.map((s,i)=>{let n=orders.filter(o=>stageOf(o.status).key===s.key&&!["Delivered"].includes(o.status)).length;return '<button class="stage '+(stage===s.key?"active":"")+'" data-stage="'+s.key+'"><b>'+(i+1)+'</b><strong>'+s.label+'</strong><span>'+n+' orders</span></button>'}).join("")}
function render(){renderRail();document.querySelectorAll("[data-scope]").forEach(b=>b.classList.toggle("active",b.dataset.scope===scope));let list=orders.filter(o=>scope==="all"||scope==="open"&&!["Delivered"].includes(o.status)||scope==="attn"&&attention(o).length);if(stage)list=list.filter(o=>stageOf(o.status).key===stage);let q=$("#q").value.trim().toLowerCase();if(q)list=list.filter(o=>[o.po,o.enq,o.customer,o.design,o.bm,o.vendor,o.city].some(v=>String(v||"").toLowerCase().includes(q)));list.sort((a,b)=>String(b.createdAt||"").localeCompare(String(a.createdAt||"")));$("#rows").innerHTML=list.map(o=>'<tr data-id="'+esc(o.id)+'"><td><b>'+esc(o.po||"PO pending")+'</b><span class="sub">'+esc(o.enq||"—")+'</span></td><td>'+esc(o.customer||"—")+'<span class="sub">'+esc(o.city||o.bm||"")+'</span></td><td>'+esc(o.design||"—")+'<span class="sub">'+esc(o.vendor||"Vendor not set")+'</span></td><td><span class="tag '+(o.status==="Delivered"?"good":attention(o).length?"warn":"")+'">'+esc(o.status||"—")+'</span><span class="sub">Stage '+(STAGES.indexOf(stageOf(o.status))+1)+'</span></td><td>'+(["Delivered"].includes(o.status)?"—":age(o)+"d")+'</td><td>'+date(o.deliveryDate)+'</td></tr>').join("");$("#empty").classList.toggle("hide",!!list.length);if(!list.length)$("#empty").innerHTML=orders.length?"No orders match the current filters.":"No orders yet. Sign in and add an order.";renderMB()}
function renderMB(){let host=$("#mb");if(!key()){host.classList.add("hide");return}host.classList.remove("hide");host.innerHTML='<div class="mbhead"><h3>Confirmed wallpaper orders</h3><span class="count" id="mbCount">—</span><button class="btn" id="mbCheck">Check now</button></div><div id="mbBody" class="mbbody"></div>';$("#mbCheck").onclick=checkMB}
async function checkMB(){let body=$("#mbBody");body.innerHTML='<div class="mbrow">Checking Metabase…</div>';try{let j=await api("/api/metabase",{method:"POST"});let rows=j.rows||[];$("#mbCount").textContent=rows.length;body.innerHTML=rows.slice(0,25).map(r=>'<div class="mbrow"><div><b>'+esc(r.order_no)+'</b><span class="sub">'+esc(r.customer||"")+' · '+esc(r.vendor_name||"")+' · '+esc(String(r.sqft||0))+' sq ft</span></div><button class="btn" data-import="'+esc(r.order_no)+'">Bring in</button></div>').join("")||'<div class="mbrow">No confirmed wallpaper orders found.</div>';body.querySelectorAll("[data-import]").forEach(b=>b.onclick=async()=>{let r=rows.find(x=>String(x.order_no)===b.dataset.import);if(!r)return;await addDoc(mbDoc(r));b.disabled=true;b.textContent="Added";load()})}catch(e){body.innerHTML='<div class="mbrow notice">'+esc(e.message)+'</div>'}}
function mbDoc(r){let placed=r.order_placed_at||now(),v=/macro/i.test(r.vendor_name||"")?"Macro Media":/life\s*n\s*colors/i.test(r.vendor_name||"")?"Life N Colors":r.vendor_name||"Not sourced yet";return{po:String(r.order_no||""),enq:String(r.enq_id||""),customer:String(r.customer||""),phone:String(r.phone||""),bm:String(r.bm||""),city:String(r.city||""),design:String(r.design_handle||"").replace(/-/g," "),vendor:v,flow:r.is_custom?"custom":"regular",status:r.availability_confirmed?"Sent to Vendor":"Sent to Procurement",statusAt:placed,dims:[],sqft:Number(r.sqft)||0,dimsSource:"On the order",renderUrl:"",renderRev:0,deliveryDate:r.promised_delivery_date?String(r.promised_delivery_date).slice(0,10):"",exception:"",onHold:false,holdReason:"",createdAt:placed,updatedAt:now(),log:[{t:placed,status:"Order Confirmed",note:"Imported from Metabase."}]}}
async function addDoc(doc){try{await api("/api/orders",{method:"POST",body:JSON.stringify({doc})})}catch(e){alert(e.message)}}
async function openOrder(id){active=orders.find(o=>o.id===id);if(!active)return;$("#board").classList.add("hide");$("#detail").classList.remove("hide");$("#tracking").classList.add("hide");renderDetail()}
function renderDetail(){let o=active;if(!o)return;$("#detail").innerHTML='<div class="crumb"><button class="btn" id="back">← Board</button></div><div class="card"><h2>'+esc(o.po||"PO pending")+'</h2><div class="muted">'+esc(o.enq||"")+'</div></div><div class="card"><h3>Order details</h3><div class="grid">'+field("PO number","po",o.po)+field("Enquiry ID","enq",o.enq)+field("Customer","customer",o.customer)+field("BM","bm",o.bm)+field("City","city",o.city)+field("Design","design",o.design)+field("Vendor","vendor",o.vendor)+'</div><div class="actions"><button class="btn primary" id="save">Save details</button></div></div><div class="card"><h3>Current status</h3><div class="field"><label>Status</label><select id="status">'+ALL.map(s=>'<option '+(s===o.status?"selected":"")+'>'+s+'</option>').join("")+'</select></div><div class="actions"><button class="btn primary" id="advance">Save status</button><button class="btn" id="delete">Delete order</button></div></div><div class="card"><h3>Timeline</h3><div class="timeline">'+STAGES.map((s,i)=>{let cur=STAGES.indexOf(stageOf(o.status));return '<div class="step '+(i<cur?"done":i===cur?"now":"")+'"><b>'+(i+1)+". "+s.label+'</b><span class="muted">'+(i<cur?"Completed":i===cur?o.status:"Not yet")+'</span></div>'}).join("")+'</div></div>';$("back").onclick=()=>{active=null;$("#detail").classList.add("hide");$("#board").classList.remove("hide");render()};$("#save").onclick=saveDetails;$("#advance").onclick=saveStatus;$("#delete").onclick=deleteOrder}
function field(label,id,val){return '<div class="field"><label>'+label+'</label><input id="f-'+id+'" value="'+esc(val||"")+'"></div>'}
async function saveDetails(){let patch={};["po","enq","customer","bm","city","design","vendor"].forEach(k=>patch[k]=$("#f-"+k).value.trim());await update(patch);alert("Saved")}
async function saveStatus(){await update({status:$("#status").value,statusAt:now()});alert("Status updated")}
async function update(patch){let doc=Object.assign({},active,patch,{updatedAt:now()});delete doc.id;await api("/api/orders?id="+encodeURIComponent(active.id),{method:"PUT",body:JSON.stringify({doc})});active=Object.assign(active,patch);load()}
async function deleteOrder(){if(!confirm("Delete this order permanently?"))return;await api("/api/orders?id="+encodeURIComponent(active.id),{method:"DELETE"});active=null;$("#detail").classList.add("hide");$("#board").classList.remove("hide");load()}
async function newOrder(){if(!key()){alert("Sign in with the team key first.");return}let po=prompt("PO number:");if(po===null)return;let enq=prompt("Enquiry ID:")||"",customer=prompt("Customer name:")||"";await addDoc({po:po.trim(),enq,customer,phone:"",bm:"",city:"",design:"",vendor:"",flow:confirm("Customised wallpaper order?")?"custom":"regular",status:"PO Raised",statusAt:now(),dims:[],dimsSource:"Not received yet",renderUrl:"",renderRev:0,deliveryDate:"",exception:"",onHold:false,holdReason:"",createdAt:now(),updatedAt:now(),log:[{t:now(),status:"PO Raised",note:"Order created."}]});load()}
async function track(){let q=$("#trackQ").value.trim();if(!q)return;let r=$("#trackResult");try{let j=await api("/api/track",{method:"POST",body:JSON.stringify({q})});let o=j.order;r.innerHTML='<div class="card"><h2>'+esc(o.po)+'</h2><p>'+esc(o.customer)+'</p><p><b>Design:</b> '+esc(o.design)+'</p><p><b>Status:</b> '+esc(o.status)+'</p><p><b>Delivery:</b> '+date(o.deliveryDate)+'</p><div class="statuslog">'+(o.log||[]).map(x=>'<div class="log"><b>'+esc(x.status)+'</b><span class="sub">'+date(x.t)+'</span></div>').join("")+'</div></div>'}catch(e){r.innerHTML='<div class="notice">'+esc(e.message)+'</div>'}}
$("#authBtn").onclick=()=>{let k=prompt(key()?"Team key (blank to sign out):":"Procurement team key:");if(k===null)return;if(k.trim())localStorage.setItem("mdwp:key",k.trim());else localStorage.removeItem("mdwp:key");location.reload()};
$("#boardBtn").onclick=()=>{location.hash="";$("#detail").classList.add("hide");$("#tracking").classList.add("hide");$("#board").classList.remove("hide");load()};
$("#trackBtn").onclick=()=>{$("#board").classList.add("hide");$("#detail").classList.add("hide");$("#tracking").classList.remove("hide")};
$("#newBtn").onclick=newOrder;$("#q").oninput=render;$("#trackGo").onclick=track;$("#trackQ").onkeydown=e=>{if(e.key==="Enter")track()};document.addEventListener("click",e=>{let s=e.target.closest("[data-stage]");if(s){stage=stage===s.dataset.stage?null:s.dataset.stage;render()}let b=e.target.closest("[data-scope]");if(b){scope=b.dataset.scope;render()}let tr=e.target.closest("tr[data-id]");if(tr)openOrder(tr.dataset.id)});
load();
</script>
</body>
</html>
